---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow required TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Deny all other incoming traffic and enable UFW
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny

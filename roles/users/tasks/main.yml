---
- name: Create admin user
  ansible.builtin.user:
    name: "{{ users_admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true

- name: Add SSH public key for admin user
  ansible.posix.authorized_key:
    user: "{{ users_admin_user }}"
    key: "{{ users_admin_ssh_public_key }}"
    state: present
  when: users_admin_ssh_public_key | length > 0

- name: Allow admin user to use sudo without password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ users_admin_user }}"
    content: "{{ users_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
